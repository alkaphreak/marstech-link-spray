# "Deploy to DigitalOcean" button template (MLS-93), read by App Platform from this path.
# Envs without a value are prompted at app creation. Spaces and SMTP are required at startup
# until MLS-263 makes them optional.
spec:
  name: marstech-link-spray
  region: tor
  services:
    - name: marstech-link-spray
      image:
        registry_type: DOCKER_HUB
        registry: alkaphreak
        repository: marstech-link-spray
        tag: latest
      http_port: 8096
      # Dockerfile heap is sized for 512 MB (MaxRAMPercentage=45)
      instance_size_slug: apps-s-1vcpu-0.5gb
      instance_count: 1
      health_check:
        http_path: /
        failure_threshold: 9
        period_seconds: 10
      envs:
        - key: MONGODB_URI_LINK_SPRAY
          scope: RUN_TIME
          type: SECRET
        - key: LINK_SPRAY_ADMIN_USERNAME
          scope: RUN_TIME
          type: SECRET
        - key: LINK_SPRAY_ADMIN_PASSWORD
          scope: RUN_TIME
          type: SECRET
        - key: LINK_SPRAY_DO_SPACES_ENDPOINT
          scope: RUN_TIME
        - key: LINK_SPRAY_DO_SPACES_REGION
          scope: RUN_TIME
          value: tor1
        - key: LINK_SPRAY_DO_SPACES_BUCKET
          scope: RUN_TIME
        - key: LINK_SPRAY_DO_SPACES_ACCESS_KEY
          scope: RUN_TIME
          type: SECRET
        - key: LINK_SPRAY_DO_SPACES_SECRET_KEY
          scope: RUN_TIME
          type: SECRET
        - key: LINK_SPRAY_SMTP_HOST
          scope: RUN_TIME
        - key: LINK_SPRAY_SMTP_PORT
          scope: RUN_TIME
          value: "587"
        - key: LINK_SPRAY_SMTP_USER
          scope: RUN_TIME
          type: SECRET
        - key: LINK_SPRAY_SMTP_PASSWORD
          scope: RUN_TIME
          type: SECRET
        - key: LINK_SPRAY_SMTP_AUTH
          scope: RUN_TIME
          value: "true"
        - key: LINK_SPRAY_SMTP_STARTTLS
          scope: RUN_TIME
          value: "true"
        - key: LINK_SPRAY_SENDER
          scope: RUN_TIME
        - key: LINK_SPRAY_RECEIVER
          scope: RUN_TIME
