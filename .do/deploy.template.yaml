# "Deploy to DigitalOcean" button template (MLS-93), read by App Platform from this path.
# Envs without a value are prompted at app creation. Image storage (LINK_SPRAY_DO_SPACES_*) and
# mail (LINK_SPRAY_SMTP_*, LINK_SPRAY_SENDER/RECEIVER) are optional (MLS-263): add them later in
# the app's settings.
spec:
  name: marstech-link-spray
  region: tor
  services:
    - name: marstech-link-spray
      image:
        registry_type: DOCKER_HUB
        registry: alkaphreak
        repository: marstech-link-spray
        tag: latest
      http_port: 8096
      # Dockerfile heap is sized for 512 MB (MaxRAMPercentage=45)
      instance_size_slug: apps-s-1vcpu-0.5gb
      instance_count: 1
      health_check:
        http_path: /
        failure_threshold: 9
        period_seconds: 10
      envs:
        - key: MONGODB_URI_LINK_SPRAY
          scope: RUN_TIME
          type: SECRET
        - key: LINK_SPRAY_ADMIN_USERNAME
          scope: RUN_TIME
          type: SECRET
        - key: LINK_SPRAY_ADMIN_PASSWORD
          scope: RUN_TIME
          type: SECRET
