<!--/*@thymesVar id="resourceId" type="java.lang.String"*/-->
<!DOCTYPE html>
<html data-bs-theme="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index.html :: html-head}">
    <title></title>
</head>
<body>

<header th:replace="~{index.html :: body-header}">
    <!-- nav bar-->
</header>

<section class="intro-section">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <h3>Write signatures - Admin</h3>
                <p>Who created a resource, from an abuse report or a legal request (MLS-254). Kept 12 months.</p>
            </div>
        </div>
    </div>
</section>

<section class="content-section">
    <div class="container">
        <form action="/admin/signatures" class="row g-2 mb-4" method="get" th:action="@{/admin/signatures}">
            <div class="col-md-8">
                <label class="visually-hidden" for="resourceId">Resource</label>
                <input class="form-control" id="resourceId" name="resourceId"
                       placeholder="Short code, paste id or spray URL" th:value="${resourceId}" type="text"/>
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i> Search</button>
            </div>
        </form>

        <p th:if="${resourceId != null and #lists.isEmpty(signatures)}">No signature for this resource.</p>

        <table class="table" th:unless="${#lists.isEmpty(signatures)}">
            <thead>
            <tr>
                <th scope="col">Date</th>
                <th scope="col">Type</th>
                <th scope="col">Resource</th>
                <th scope="col">Fingerprint</th>
                <th scope="col">IP</th>
                <th scope="col">User-Agent</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="signature : ${signatures}">
                <td th:text="${signature.createdAt}">date</td>
                <td th:text="${signature.resourceType}">type</td>
                <td class="text-break" th:text="${signature.resourceId}">resource</td>
                <td class="font-monospace text-break" th:text="${signature.fingerprintHash} ?: '-'">hash</td>
                <td th:text="${signature.ipAddress} ?: '-'">ip</td>
                <td class="small text-break" th:text="${signature.userAgent} ?: '-'">ua</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

<footer th:replace="~{index.html :: body-footer}">
    <!-- footer -->
</footer>

<div class="d-none" th:replace="~{index.html :: footer-div-script}">
    <!-- footer script -->
</div>
</body>
</html>
