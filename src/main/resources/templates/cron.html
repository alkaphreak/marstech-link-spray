<!DOCTYPE html>
<html data-bs-theme="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index.html :: html-head}">
    <title></title>
</head>
<body>

<header th:replace="~{index.html :: body-header}">
    <!-- nav bar-->
</header>

<section class="intro-section">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <h3>Cron jobs</h3>
                <p class="text-body-secondary">The jobs of one API key: status, next run, history, pause and resume.
                    Create them with the <a href="https://github.com/alkaphreak/marstech-link-spray#api-endpoints">cron API</a>.
                    Pausing or resuming a job resets its failure count.</p>
            </div>
        </div>
    </div>
</section>

<section class="get-started">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">

                <!-- The key stays in this tab only (sessionStorage), it is sent as X-Api-Key to /api/cron/jobs. -->
                <form id="cronKeyForm" class="d-flex gap-2 mb-3" autocomplete="off">
                    <label for="cronApiKey" class="visually-hidden">API key</label>
                    <input type="password" id="cronApiKey" class="form-control" placeholder="API key" required>
                    <button class="btn btn-primary" type="submit"><i class="bi bi-arrow-repeat"></i> Load</button>
                    <button id="cronForgetBtn" class="btn btn-outline-secondary" type="button">Forget</button>
                </form>

                <div id="cronAlert" role="status" aria-live="polite"></div>

                <div class="table-responsive">
                    <table class="table align-middle d-none" id="cronJobs">
                        <thead>
                        <tr>
                            <th scope="col">Status</th><th scope="col">Name</th><th scope="col">Schedule (UTC)</th><th scope="col">Target</th>
                            <th scope="col">Failures</th><th scope="col">Last run</th><th scope="col">Next run</th><th scope="col">Enabled</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <h5 class="mt-4 d-none" id="cronRunsTitle"></h5>
                <ul class="list-group" id="cronRuns"></ul>


                <script th:src="@{/assets/js/pages/cron.js}"></script>

            </div>
        </div>
    </div>
</section>

<footer th:replace="~{index.html :: body-footer}">
    <!-- footer -->
</footer>

<div class="d-none" th:replace="~{index.html :: footer-div-script}">
    <!-- footer script -->
</div>
</body>
</html>
