<!DOCTYPE html>
<html data-bs-theme="dark" lang="en" th:attr="data-bs-theme=${dashboard != null ? dashboard.theme.bsTheme : 'dark'}"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index.html :: html-head}">
    <title></title>
</head>
<body>

<header th:replace="~{index.html :: body-header}">
    <!-- nav bar-->
</header>

<!--/*@thymesVar id="dashboard" type="fr.marstech.mtlinkspray.dto.DashboardDto"*/-->
<section class="intro-section">
    <div class="container">
        <div class="row align-items-center">
            <div class="col" th:unless="${dashboard}">
                <h3>Dashboard</h3>
            </div>
            <div class="col text-center" th:if="${dashboard}">
                <img alt="" class="rounded-circle mb-3" height="96" id="dashboard-avatar" th:if="${dashboard.avatarUrl}"
                     th:src="${dashboard.avatarUrl}" width="96"/>
                <h3 th:text="${dashboard.name}">Dashboard</h3>
                <p id="dashboard-bio" th:if="${dashboard.bio}" th:text="${dashboard.bio}">Bio</p>
                <p th:if="${dashboard.description}" th:text="${dashboard.description}">
                    Dashboard description
                </p>
            </div>
        </div>
    </div>
</section>

<section class="content-section" th:unless="${dashboard}"
         th:with="view=${T(fr.marstech.mtlinkspray.enums.ViewNameEnum).DASHBOARD}">
    <div class="container">
        <div class="row">
            <div class="col">
                <form accept-charset="UTF-8"
                      action="/" method="post" th:action="@{'/'+${view.getViewName()}}">
                    <!-- Add your content here -->
                    <div class="mb-3">
                        <label class="form-label" for="input-dashboard-name">
                            Dashboard name
                        </label>
                        <input class="form-control"
                               id="input-dashboard-name"
                               name="input-dashboard-name"
                               placeholder="Enter dashboard name"
                               type="text"
                        />
                    </div>
                    <div class="mb-3">
                        <button class="btn btn-primary" type="submit">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<section class="content-section" th:if="${dashboard}"
         th:with="view=${T(fr.marstech.mtlinkspray.enums.ViewNameEnum).DASHBOARD}">
    <div class="container">
        <div class="row">
            <div class="col-md-6 mx-auto d-grid gap-2" id="dashboard-links">
                <!--/*@thymesVar id="item" type="fr.marstech.mtlinkspray.entity.DashboardLink"*/-->
                <a class="btn btn-outline-primary" rel="noopener nofollow" target="_blank"
                   th:each="item : ${dashboard.items}" th:href="${item.url}" th:title="${item.description}">
                    <span th:text="${item.name}">Name</span>
                </a>

            </div>
        </div>
    </div>

</section>

<footer th:replace="~{index.html :: body-footer}">
    <!-- footer -->
</footer>

<div class="d-none" th:replace="~{index.html :: footer-div-script}">
    <!-- footer script -->
</div>
</body>
</html>
