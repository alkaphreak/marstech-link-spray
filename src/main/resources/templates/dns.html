<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index.html :: html-head}">
    <title></title>
</head>
<body>

<header th:replace="~{index.html :: body-header}">
    <!-- nav bar-->
</header>

<section class="intro-section">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <h3>DNS Tools</h3>

                <p>Look up DNS records, check propagation across public resolvers, or find the name behind an IP.</p>
            </div>
        </div>
    </div>
</section>

<section class="get-started" th:with="view=${T(fr.marstech.mtlinkspray.enums.ViewNameEnum).DNS}">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <form id="dnsForm">
                    <div class="mb-3">
                        <label class="form-label" for="dnsName">Domain name or IP (reverse lookup)</label>
                        <input class="form-control" id="dnsName" placeholder="example.com" required type="text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="dnsType">Record type</label>
                        <select class="form-select" id="dnsType">
                            <option>A</option>
                            <option>AAAA</option>
                            <option>MX</option>
                            <option>TXT</option>
                            <option>CNAME</option>
                            <option>NS</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="dnsLookup" type="submit">
                        <i class="bi bi-search"></i> Lookup
                    </button>
                    <button class="btn btn-outline-primary" id="dnsPropagation" type="button">
                        <i class="bi bi-globe"></i> Check propagation
                    </button>
                </form>

                <table class="table mt-4 d-none" id="dnsResults">
                    <thead>
                    <tr>
                        <th scope="col">Resolver</th>
                        <th scope="col">Records</th>
                        <th scope="col">Time (ms)</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <p class="d-none" id="dnsConsistency"></p>
            </div>
        </div>
    </div>
    <script>
        const isIp = s => /^[0-9.]+$/.test(s) || s.includes(':');

        function cell(text) {
            const td = document.createElement('td');
            td.textContent = text;
            return td;
        }

        function show(results, consistent) {
            const table = document.getElementById('dnsResults');
            const body = table.querySelector('tbody');
            body.replaceChildren(...results.map(r => {
                const tr = document.createElement('tr');
                tr.append(cell(r.resolver), cell(r.error ?? (r.records.join('\n') || '(no record)')), cell(r.timeMs));
                tr.lastChild.previousSibling.style.whiteSpace = 'pre-line';
                return tr;
            }));
            table.classList.remove('d-none');
            const note = document.getElementById('dnsConsistency');
            note.classList.toggle('d-none', consistent === undefined);
            if (consistent !== undefined) {
                note.textContent = consistent ? 'All resolvers agree.' : 'Resolvers disagree: the change may still be propagating.';
            }
        }

        async function run(propagation) {
            const name = document.getElementById('dnsName').value.trim();
            const type = document.getElementById('dnsType').value;
            const path = propagation ? '/api/dns/propagation' : '/api/dns';
            const url = isIp(name) ? '/api/dns/reverse?ip=' + encodeURIComponent(name)
                : path + '?name=' + encodeURIComponent(name) + '&type=' + type;
            const response = await fetch(url);
            const json = await response.json();
            if (!response.ok) {
                show([{resolver: '-', records: [], error: json.fieldErrors?.[0]?.message ?? json.message ?? response.statusText, timeMs: ''}]);
            } else if (json.results) {
                show(json.results, json.consistent);
            } else {
                show([json]);
            }
        }

        document.getElementById('dnsForm').addEventListener('submit', e => {
            e.preventDefault();
            run(false);
        });
        document.getElementById('dnsPropagation').addEventListener('click', () => run(true));
    </script>
</section>

<footer class="footer bg-black text-white" th:replace="~{index.html :: body-footer}">
    <!-- footer -->
</footer>

<div class="d-none" th:replace="~{index.html :: footer-div-script}">
    <!-- footer script -->
</div>
</body>
</html>
