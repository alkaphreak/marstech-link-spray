<!--/*@thymesVar id="viewNameEnum" type="fr.marstech.mtlinkspray.enums.ViewNameEnum"*/-->
<!DOCTYPE html>
<html data-bs-theme="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="html-head">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${T(fr.marstech.mtlinkspray.objects.CommonConfs).SITE_TITLE}">Marstech - Link Spray</title>

    <!-- Bootstrap CSS - https://getbootstrap.com/docs/5.3/getting-started/introduction/ -->
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet">

    <!-- Bootstrap Icons - https://icons.getbootstrap.com/ -->
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" rel="stylesheet">

    <!-- MarsTech-Skin (https://github.com/alkaphreak/MarsTech-Skin), vendored in static/assets/skin -->
    <link href="../static/assets/skin/fonts.css" rel="stylesheet" th:href="@{'/assets/skin/fonts.css'}">
    <link href="../static/assets/skin/tokens.css" rel="stylesheet" th:href="@{'/assets/skin/tokens.css'}">
    <link href="../static/assets/skin/marstech.css" rel="stylesheet" th:href="@{'/assets/skin/marstech.css'}">

    <!-- sol4.space: Bootstrap to Skin bridge -->
    <link href="../static/assets/css/sol4.css" rel="stylesheet" th:href="@{'/assets/css/sol4.css'}">

    <link href="../static/assets/img/favicons/apple-touch-icon.png" rel="apple-touch-icon"
          sizes="180x180"
          th:href="@{'/assets/img/favicons/apple-touch-icon.png'}"/>
    <link href="../static/assets/img/favicons/favicon-48.png" rel="icon" sizes="48x48"
          th:href="@{'/assets/img/favicons/favicon-48.png'}"
          type="image/png"
    />
    <link href="../static/assets/img/favicons/favicon-32.png" rel="icon" sizes="32x32"
          th:href="@{'/assets/img/favicons/favicon-32.png'}"
          type="image/png"
    />
    <link href="../static/assets/img/favicons/favicon-16.png" rel="icon" sizes="16x16"
          th:href="@{'/assets/img/favicons/favicon-16.png'}"
          type="image/png"
    />
    <link href="../static/assets/img/favicons/manifest.json"
          rel="manifest"
          th:href="@{'/assets/img/favicons/manifest.json'}"
    />
    <meta content="#da532c" name="msapplication-TileColor"/>
    <meta content="#05070a" name="theme-color"/>
</head>
<body>
<header class="navbar-expand-lg" th:fragment="body-header">
    <div class="mt-header">
        <div class="container">
            <a class="mt-brand" href="/">sol4<span class="dot">.</span>space</a>
            <button aria-controls="site-menu" aria-expanded="false" aria-label="Toggle navigation"
                    class="navbar-toggler collapsed ms-auto" data-bs-target="#site-menu" data-bs-toggle="collapse"
                    type="button">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </div>
    <!-- Below lg the tools collapse into a vertical menu behind the burger (Bootstrap collapse) -->
    <nav aria-label="Tools" class="mt-menu collapse navbar-collapse" id="site-menu">
        <ul class="container navbar-nav">
            <li th:each="view : ${T(fr.marstech.mtlinkspray.enums.ViewNameEnum).inMenu()}">
                <a th:attr="aria-current=${null != viewNameEnum && viewNameEnum.name() == view.name()} ? 'page' : null"
                   th:href="@{'/' + ${view.getViewName()}}"
                   th:text="${view.getViewPage()}">Tool</a>
            </li>
        </ul>
    </nav>
</header>

<section class="intro-section">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <h3 th:text="${T(fr.marstech.mtlinkspray.objects.CommonConfs).SITE_TITLE}">Marstech - Link Spray</h3>

                <p>
                    Open multiple URLs in one click, shorten URL and many more.
                </p>
            </div>
        </div>
    </div>
</section>

<section class="get-started">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                Explore the features of <span
                    th:text="${T(fr.marstech.mtlinkspray.objects.CommonConfs).SITE_TITLE}"></span>.
            </div>
        </div>
    </div>
</section>

<footer class="mt-foot" th:fragment="body-footer">
    <div class="container">
        <ul>
            <li>From <a href="https://marstech.fr/">Marstech</a> for public use, since 2021</li>
            <li>Created by <a href="https://cv.marstech.fr/" target="_blank">Stéphane ROBIN</a></li>
            <li><a href="https://github.com/alkaphreak/marstech-link-spray" target="_blank">github/marstech-link-spray</a></li>
            <li th:with="view=${T(fr.marstech.mtlinkspray.enums.ViewNameEnum).PRIVACY}">
                <a th:href="@{'/'+${view.getViewName()}}">Privacy</a>
            </li>
            <li th:with="view=${T(fr.marstech.mtlinkspray.enums.ViewNameEnum).ABUSE}">
                <a th:href="@{'/'+${view.getViewName()}}">Abuse report</a>
            </li>
            <li class="mt-meta">Version <span th:text="${@rootApiController.version}">App version</span></li>
        </ul>
    </div>
</footer>

<div class="d-none" th:fragment="footer-div-script">
    <!-- Bootstrap JavaScript Bundle with Popper -->
    <script crossorigin="anonymous"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- static/assets/js/mt-script.js -->
    <script th:src="@{'/assets/js/mt-script.js'}"></script>
    <!-- static/assets/js/fingerprint.js: fills the hidden "fp" field of data-fingerprint forms (MLS-254) -->
    <script th:src="@{'/assets/js/fingerprint.js'}" type="module"></script>
</div>
</body>
</html>
