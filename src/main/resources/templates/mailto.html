<!DOCTYPE html>
<html data-bs-theme="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index.html :: html-head}">
    <title></title>
</head>
<body>

<header th:replace="~{index.html :: body-header}">
    <!-- nav bar-->
</header>

<section class="intro-section">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <h3>Mailto Link Generator</h3>

                <p>Build a <code>mailto:</code> link with recipients, subject and body, encoded for any mail client.</p>
            </div>
        </div>
    </div>
</section>

<section class="get-started" th:with="view=${T(fr.marstech.mtlinkspray.enums.ViewNameEnum).MAILTO}">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <form id="mailtoForm">
                    <div class="mb-3">
                        <label class="form-label" for="mailtoTo">To</label>
                        <input class="form-control" id="mailtoTo" placeholder="recipient@example.com" type="text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="mailtoCc">CC</label>
                        <input class="form-control" id="mailtoCc" placeholder="cc1@example.com, cc2@example.com"
                               type="text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="mailtoBcc">BCC</label>
                        <input class="form-control" id="mailtoBcc" placeholder="bcc1@example.com, bcc2@example.com"
                               type="text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="mailtoSubject">Subject</label>
                        <input class="form-control" id="mailtoSubject" type="text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="mailtoBody">Body</label>
                        <textarea class="form-control" id="mailtoBody" rows="5"></textarea>
                    </div>

                    <label class="form-label" for="mailtoLink">Mailto link</label>
                    <input class="form-control-plaintext user-select-all" id="mailtoLink" readonly="readonly"
                           type="text" value="mailto:">
                    <button class="btn btn-primary"
                            data-copy-input="mailtoLink"
                            type="button">
                        <i class="bi bi-clipboard"></i> Copy link
                    </button>
                    <a class="btn btn-outline-primary" href="mailto:" id="mailtoOpen">
                        <i class="bi bi-envelope"></i> Open in mail client
                    </a>
                    <div id="liveAlertPlaceholder"></div>
                </form>
            </div>
        </div>
    </div>
    <script th:src="@{/assets/js/pages/mailto.js}"></script>
</section>

<footer th:replace="~{index.html :: body-footer}">
    <!-- footer -->
</footer>

<div class="d-none" th:replace="~{index.html :: footer-div-script}">
    <!-- footer script -->
</div>
</body>
</html>
