<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index.html :: html-head}">
    <title></title>
</head>
<body>

<header th:replace="~{index.html :: body-header}">
    <!-- nav bar-->
</header>

<section class="intro-section">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <h3>OCR</h3>

                <p>Extract the text of a PNG or JPEG image, or of a scanned PDF of up to 2 pages. Free use is limited per hour; apps can call
                    <code>POST /api/ocr</code> with an API key.</p>
            </div>
        </div>
    </div>
</section>

<section class="get-started" th:with="view=${T(fr.marstech.mtlinkspray.enums.ViewNameEnum).OCR}">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <form id="ocrForm">
                    <div class="mb-3">
                        <label class="form-label" for="ocrFile">Image (PNG or JPEG) or PDF (2 pages max)</label>
                        <input accept="image/png,image/jpeg,application/pdf" class="form-control" id="ocrFile" required type="file">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="ocrLang">Language</label>
                        <select class="form-select" id="ocrLang">
                            <option value="fra">French</option>
                            <option value="fra+eng">French and English</option>
                            <option value="eng">English</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="ocrSubmit" type="submit">
                        <i class="bi bi-file-text"></i> Extract text
                    </button>
                </form>

                <p class="mt-4 d-none" id="ocrStatus"></p>
                <div class="mt-3 d-none" id="ocrOutput">
                    <label class="form-label" for="ocrText">Text</label>
                    <textarea class="form-control" id="ocrText" readonly rows="12"></textarea>
                    <button class="btn btn-outline-primary mt-2" id="ocrCopy" type="button">
                        <i class="bi bi-clipboard"></i> Copy
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const statusLine = document.getElementById('ocrStatus');
        const output = document.getElementById('ocrOutput');

        function showStatus(text) {
            statusLine.textContent = text;
            statusLine.classList.toggle('d-none', !text);
        }

        document.getElementById('ocrForm').addEventListener('submit', async e => {
            e.preventDefault();
            const file = document.getElementById('ocrFile').files[0];
            const lang = document.getElementById('ocrLang').value;
            const button = document.getElementById('ocrSubmit');
            button.disabled = true;
            output.classList.add('d-none');
            showStatus('Reading the image...');
            try {
                const response = await fetch('/api/ocr?lang=' + encodeURIComponent(lang), {
                    method: 'POST',
                    headers: {'Content-Type': file.type || 'application/octet-stream'},
                    body: file
                });
                const json = await response.json();
                if (!response.ok) {
                    showStatus(json.message ?? response.statusText);
                    return;
                }
                document.getElementById('ocrText').value = json.text;
                output.classList.remove('d-none');
                showStatus(json.text ? 'Done in ' + json.processingTimeMs + ' ms.' : 'No text found in this image.');
            } catch (error) {
                showStatus('Request failed: ' + error.message);
            } finally {
                button.disabled = false;
            }
        });

        document.getElementById('ocrCopy').addEventListener('click',
            () => navigator.clipboard.writeText(document.getElementById('ocrText').value));
    </script>
</section>

<footer class="footer bg-black text-white" th:replace="~{index.html :: body-footer}">
    <!-- footer -->
</footer>

<div class="d-none" th:replace="~{index.html :: footer-div-script}">
    <!-- footer script -->
</div>
</body>
</html>
