<!DOCTYPE html>
<html data-bs-theme="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index.html :: html-head}">
    <title></title>
</head>
<body>

<header th:replace="~{index.html :: body-header}">
    <!-- nav bar-->
</header>

<section class="intro-section">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <h3>OCR</h3>

                <p>Extract the text of a PNG or JPEG image, or of a one-page scanned PDF. Free use is limited per hour; apps can call
                    <code>POST /api/ocr</code> with an API key.</p>
            </div>
        </div>
    </div>
</section>

<section class="get-started" th:with="view=${T(fr.marstech.mtlinkspray.enums.ViewNameEnum).OCR}">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <form id="ocrForm">
                    <div class="mb-3">
                        <label class="form-label" for="ocrFile">Image (PNG or JPEG) or PDF (1 page)</label>
                        <input accept="image/png,image/jpeg,application/pdf" class="form-control" id="ocrFile" required type="file">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="ocrLang">Language</label>
                        <select class="form-select" id="ocrLang">
                            <option value="fra">French</option>
                            <option value="fra+eng">French and English</option>
                            <option value="eng">English</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="ocrSubmit" type="submit">
                        <i class="bi bi-file-text"></i> Extract text
                    </button>
                </form>

                <p class="mt-4 d-none" id="ocrStatus"></p>
                <div class="mt-3 d-none" id="ocrOutput">
                    <label class="form-label" for="ocrText">Text</label>
                    <textarea class="form-control" id="ocrText" readonly rows="12"></textarea>
                    <button class="btn btn-outline-primary mt-2" id="ocrCopy" type="button">
                        <i class="bi bi-clipboard"></i> Copy
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/assets/js/pages/ocr.js}"></script>
</section>

<footer th:replace="~{index.html :: body-footer}">
    <!-- footer -->
</footer>

<div class="d-none" th:replace="~{index.html :: footer-div-script}">
    <!-- footer script -->
</div>
</body>
</html>
