<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index.html :: html-head}">
    <title></title>
</head>
<body>

<header th:replace="~{index.html :: body-header}">
    <!-- nav bar-->
</header>

<section class="intro-section">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <h3>QR Code Generator</h3>

                <p>Generate a QR code for text, a URL, WiFi credentials or a contact card, then download it as PNG or SVG.</p>
            </div>
        </div>
    </div>
</section>

<section class="get-started" th:with="view=${T(fr.marstech.mtlinkspray.enums.ViewNameEnum).QR}">
    <div class="container">
        <div class="row">
            <div class="col-md-7">
                <form id="qrForm" onsubmit="return false;">
                    <div class="mb-3">
                        <label class="form-label" for="qrType">Type</label>
                        <select class="form-select" id="qrType">
                            <option value="text">Text / custom data</option>
                            <option value="url">URL</option>
                            <option value="wifi">WiFi</option>
                            <option value="vcard">Contact card (vCard)</option>
                        </select>
                    </div>

                    <div class="mb-3 qr-fields" data-types="text url">
                        <label class="form-label" for="qrText">Content</label>
                        <textarea class="form-control" id="qrText" maxlength="2000" rows="3"
                                  placeholder="https://sol4.space"></textarea>
                    </div>

                    <div class="form-check mb-3 qr-fields d-none" data-types="url">
                        <input class="form-check-input" id="qrShortenFirst" type="checkbox">
                        <label class="form-check-label" for="qrShortenFirst">Shorten first</label>
                        <div class="form-text" id="qrShortUrl"></div>
                    </div>

                    <div class="qr-fields d-none" data-types="wifi">
                        <div class="mb-3">
                            <label class="form-label" for="wifiSsid">Network name (SSID)</label>
                            <input class="form-control" id="wifiSsid" type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="wifiPassword">Password</label>
                            <input class="form-control" id="wifiPassword" type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="wifiSecurity">Security</label>
                            <select class="form-select" id="wifiSecurity">
                                <option value="WPA">WPA/WPA2/WPA3</option>
                                <option value="WEP">WEP</option>
                                <option value="nopass">None</option>
                            </select>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" id="wifiHidden" type="checkbox">
                            <label class="form-check-label" for="wifiHidden">Hidden network</label>
                        </div>
                    </div>

                    <div class="qr-fields d-none" data-types="vcard">
                        <div class="mb-3">
                            <label class="form-label" for="vcardName">Full name</label>
                            <input class="form-control" id="vcardName" type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="vcardPhone">Phone</label>
                            <input class="form-control" id="vcardPhone" type="tel">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="vcardEmail">Email</label>
                            <input class="form-control" id="vcardEmail" type="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="vcardOrg">Organization</label>
                            <input class="form-control" id="vcardOrg" type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="vcardUrl">Website</label>
                            <input class="form-control" id="vcardUrl" type="url">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label" for="qrFg">Foreground</label>
                            <input class="form-control form-control-color" id="qrFg" type="color" value="#000000">
                        </div>
                        <div class="col">
                            <label class="form-label" for="qrBg">Background</label>
                            <input class="form-control form-control-color" id="qrBg" type="color" value="#ffffff">
                        </div>
                        <div class="col">
                            <label class="form-label" for="qrSize">Size (px)</label>
                            <input class="form-control" id="qrSize" max="1024" min="64" step="32" type="number"
                                   value="256">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <a class="btn btn-primary disabled" id="qrDownloadPng" href="#">
                            <i class="bi bi-download"></i> PNG
                        </a>
                        <a class="btn btn-primary disabled" id="qrDownloadSvg" href="#">
                            <i class="bi bi-download"></i> SVG
                        </a>
                    </div>
                    <div class="mt-3" id="qrAlert" role="alert"></div>
                </form>
            </div>

            <div class="col-md-5 text-center">
                <img alt="QR code preview" class="img-fluid d-none" id="qrPreview">
            </div>
        </div>

        <script>
            const qrType = document.getElementById('qrType');
            const qrPreview = document.getElementById('qrPreview');
            const qrAlert = document.getElementById('qrAlert');
            const downloadPng = document.getElementById('qrDownloadPng');
            const downloadSvg = document.getElementById('qrDownloadSvg');
            const shortenFirst = document.getElementById('qrShortenFirst');
            const shortUrlText = document.getElementById('qrShortUrl');
            const val = id => document.getElementById(id).value.trim();
            // Shortened on change, not on input: each call stores a short link
            const shortUrls = new Map();
            const useShortUrl = () => qrType.value === 'url' && shortenFirst.checked;

            // WiFi (ZXing MECARD-like) and vCard both reserve these characters
            const escWifi = s => s.replace(/([\\;,:"])/g, '\\$1');
            const escVcard = s => s.replace(/([\\;,])/g, '\\$1').replace(/\n/g, '\\n');

            function payload() {
                switch (qrType.value) {
                    case 'wifi': {
                        if (!val('wifiSsid')) return '';
                        const sec = val('wifiSecurity');
                        return `WIFI:T:${sec};S:${escWifi(val('wifiSsid'))};`
                            + (sec === 'nopass' ? '' : `P:${escWifi(val('wifiPassword'))};`)
                            + (document.getElementById('wifiHidden').checked ? 'H:true;' : '') + ';';
                    }
                    case 'vcard': {
                        if (!val('vcardName')) return '';
                        const lines = ['BEGIN:VCARD', 'VERSION:3.0', `FN:${escVcard(val('vcardName'))}`];
                        if (val('vcardPhone')) lines.push(`TEL:${escVcard(val('vcardPhone'))}`);
                        if (val('vcardEmail')) lines.push(`EMAIL:${escVcard(val('vcardEmail'))}`);
                        if (val('vcardOrg')) lines.push(`ORG:${escVcard(val('vcardOrg'))}`);
                        if (val('vcardUrl')) lines.push(`URL:${escVcard(val('vcardUrl'))}`);
                        lines.push('END:VCARD');
                        return lines.join('\r\n');
                    }
                    case 'url':
                        if (shortenFirst.checked) return shortUrls.get(val('qrText')) || '';
                        return document.getElementById('qrText').value;
                    default:
                        return document.getElementById('qrText').value;
                }
            }

            function qrUrl(format, download) {
                const params = new URLSearchParams({
                    text: payload(),
                    size: val('qrSize'),
                    fg: val('qrFg').slice(1),
                    bg: val('qrBg').slice(1),
                    format: format
                });
                if (download) params.set('download', 'true');
                return `/api/qr?${params}`;
            }

            function refresh() {
                document.querySelectorAll('.qr-fields').forEach(el =>
                    el.classList.toggle('d-none', !el.dataset.types.split(' ').includes(qrType.value)));
                qrAlert.className = 'mt-3';
                qrAlert.textContent = '';
                shortUrlText.textContent = useShortUrl() ? (shortUrls.get(val('qrText')) || '') : '';
                const empty = !payload().trim();
                qrPreview.classList.toggle('d-none', empty);
                [downloadPng, downloadSvg].forEach(a => a.classList.toggle('disabled', empty));
                if (empty) return;
                qrPreview.src = qrUrl('svg', false);
                downloadPng.href = qrUrl('png', true);
                downloadSvg.href = qrUrl('svg', true);
            }

            function showError(err, fallback) {
                const details = (err.fieldErrors || []).map(f => f.message).join(', ');
                qrAlert.className = 'mt-3 alert alert-warning';
                qrAlert.textContent = details || err.message || fallback;
            }

            async function shortenThenRefresh() {
                const url = val('qrText');
                if (!useShortUrl() || !url || shortUrls.has(url)) return refresh();
                const res = await fetch(`/api/url-shortener/shorten?${new URLSearchParams({url})}`).catch(() => null);
                if (res && res.ok) shortUrls.set(url, (await res.text()).trim());
                refresh();
                // The endpoint answers an invalid URL with a raw 500 message: only show field errors
                if (!res || !res.ok) showError({fieldErrors: res && (await res.json().catch(() => ({}))).fieldErrors},
                    'URL shortening failed: check that the URL is valid');
            }

            qrPreview.addEventListener('error', async () => {
                qrPreview.classList.add('d-none');
                showError(await fetch(qrPreview.src).then(r => r.json()).catch(() => ({})), 'QR code generation failed');
            });

            let timer;
            document.getElementById('qrForm').addEventListener('input', () => {
                clearTimeout(timer);
                timer = setTimeout(refresh, 300);
            });
            document.getElementById('qrForm').addEventListener('change', e => {
                if (['qrType', 'qrText', 'qrShortenFirst'].includes(e.target.id)) shortenThenRefresh();
            });
            refresh();
        </script>
    </div>
</section>

<footer class="footer bg-black text-white" th:replace="~{index.html :: body-footer}">
    <!-- footer -->
</footer>

<div class="d-none" th:replace="~{index.html :: footer-div-script}">
    <!-- footer script -->
</div>
</body>
</html>
