<!DOCTYPE html>
<html data-bs-theme="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{index.html :: html-head}">
    <title></title>
</head>
<body>

<header th:replace="~{index.html :: body-header}">
    <!-- nav bar-->
</header>

<section class="intro-section">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <h3>QR Code Generator</h3>

                <p>Generate a QR code for text, a URL, WiFi credentials or a contact card, then download it as PNG or SVG.
                    Bulk mode turns each line into its own QR code, downloaded together as a ZIP.</p>
            </div>
        </div>
    </div>
</section>

<section class="get-started" th:with="view=${T(fr.marstech.mtlinkspray.enums.ViewNameEnum).QR}">
    <div class="container">
        <div class="row">
            <div class="col-md-7">
                <form id="qrForm" data-no-submit>
                    <div class="mb-3">
                        <label class="form-label" for="qrType">Type</label>
                        <select class="form-select" id="qrType">
                            <option value="text">Text / custom data</option>
                            <option value="url">URL</option>
                            <option value="wifi">WiFi</option>
                            <option value="vcard">Contact card (vCard)</option>
                            <option value="bulk">Bulk: one QR code per line (ZIP)</option>
                        </select>
                    </div>

                    <div class="mb-3 qr-fields" data-types="text url bulk">
                        <label class="form-label" for="qrText">Content</label>
                        <textarea class="form-control" id="qrText" maxlength="2000" rows="3"
                                  placeholder="https://sol4.space"></textarea>
                        <div class="form-text qr-fields d-none" data-types="bulk">One QR code per line, up to 100 lines.</div>
                    </div>

                    <div class="form-check mb-3 qr-fields d-none" data-types="url">
                        <input class="form-check-input" id="qrShortenFirst" type="checkbox">
                        <label class="form-check-label" for="qrShortenFirst">Shorten first</label>
                        <div class="form-text" id="qrShortUrl"></div>
                    </div>

                    <div class="qr-fields d-none" data-types="wifi">
                        <div class="mb-3">
                            <label class="form-label" for="wifiSsid">Network name (SSID)</label>
                            <input class="form-control" id="wifiSsid" type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="wifiPassword">Password</label>
                            <input class="form-control" id="wifiPassword" type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="wifiSecurity">Security</label>
                            <select class="form-select" id="wifiSecurity">
                                <option value="WPA">WPA/WPA2/WPA3</option>
                                <option value="WEP">WEP</option>
                                <option value="nopass">None</option>
                            </select>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" id="wifiHidden" type="checkbox">
                            <label class="form-check-label" for="wifiHidden">Hidden network</label>
                        </div>
                    </div>

                    <div class="qr-fields d-none" data-types="vcard">
                        <div class="mb-3">
                            <label class="form-label" for="vcardName">Full name</label>
                            <input class="form-control" id="vcardName" type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="vcardPhone">Phone</label>
                            <input class="form-control" id="vcardPhone" type="tel">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="vcardEmail">Email</label>
                            <input class="form-control" id="vcardEmail" type="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="vcardOrg">Organization</label>
                            <input class="form-control" id="vcardOrg" type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="vcardUrl">Website</label>
                            <input class="form-control" id="vcardUrl" type="url">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label" for="qrFg">Foreground</label>
                            <input class="form-control form-control-color" id="qrFg" type="color" value="#000000">
                        </div>
                        <div class="col">
                            <label class="form-label" for="qrBg">Background</label>
                            <input class="form-control form-control-color" id="qrBg" type="color" value="#ffffff">
                        </div>
                        <div class="col">
                            <label class="form-label" for="qrSize">Size (px)</label>
                            <input class="form-control" id="qrSize" max="1024" min="64" step="32" type="number"
                                   value="256">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <a class="btn btn-primary disabled" id="qrDownloadPng" href="#">
                            <i class="bi bi-download"></i> PNG
                        </a>
                        <a class="btn btn-primary disabled" id="qrDownloadSvg" href="#">
                            <i class="bi bi-download"></i> SVG
                        </a>
                    </div>
                    <div class="mt-3" id="qrAlert" role="alert"></div>
                </form>
            </div>

            <div class="col-md-5 text-center">
                <img alt="QR code preview" class="img-fluid d-none" id="qrPreview">
            </div>
        </div>

        <script th:src="@{/assets/js/pages/qr.js}"></script>
    </div>
</section>

<footer th:replace="~{index.html :: body-footer}">
    <!-- footer -->
</footer>

<div class="d-none" th:replace="~{index.html :: footer-div-script}">
    <!-- footer script -->
</div>
</body>
</html>
