# -------------------------------------------------------
# E2E profile (MLS-277), used alone (not layered on application-test.properties): the suite
# owns every value it relies on, so migration PRs editing src/main cannot change them (ADR 0007)
# -------------------------------------------------------

# Embedded MongoDB (flapdoodle spring4x); CI caches ~/.embedmongo under this version
de.flapdoodle.mongodb.embedded.version=8.0.5

# Random id generation
mt.link-spray.random-id.charset=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
mt.link-spray.random-id.length=5
mt.link-spray.random-id.prefix=
mt.link-spray.random-id.cache.enabled=true
mt.link-spray.random-id.cache.depth=100
mt.link-spray.random-id.cache.treshold=10

# Mail: E2eMailConfiguration replaces the sender with a mock, these only satisfy the binding
spring.mail.host=localhost
spring.mail.port=1025
mt.link-spray.notification.mail.sender=e2e@localhost
mt.link-spray.notification.mail.receiver=e2e@localhost

# Admin: E2eTest.ADMIN_USER / ADMIN_PASSWORD
mt.link-spray.admin.username=admin
mt.link-spray.admin.password=test-admin-password

# Per-IP write quotas off: one shared context would carry buckets across test classes
# (QuotaE2eTest turns them back on in its own context)
mt.link-spray.rate-limit.writes.window-ms=0
mt.link-spray.rate-limit.abuse.window-ms=0

# Real DB-IP test files instead of /app/geoip
mt.link-spray.geoip.dir=${user.dir}/src/test/resources/geoip

# Native binaries replaced by stand-in scripts (fixed outputs), whatever is installed on the machine
mt.link-spray.ocr.command=${user.dir}/src/test/resources/e2e-bin/tesseract
mt.link-spray.img.cwebp-command=${user.dir}/src/test/resources/e2e-bin/cwebp
mt.link-spray.img.caesium-command=${user.dir}/src/test/resources/e2e-bin/caesiumclt

# Object storage: E2eTest points the endpoint at FakeS3 (an in-memory S3 on the JDK HTTP server)
mt.link-spray.storage.do-spaces.region=tor1
mt.link-spray.storage.do-spaces.bucket=e2e-bucket
mt.link-spray.storage.do-spaces.access-key=e2e-access-key
mt.link-spray.storage.do-spaces.secret-key=e2e-secret-key

# Limits the assertions rely on (413 cases, TTL index shape), pinned here rather than inherited
# from application.properties or @Value defaults
mt.link-spray.md2pdf.max-input-bytes=1048576
mt.link-spray.img.png-max-pixels=3000000
mt.link-spray.cron.run-retention-days=30
