# ArchUnit (MLS-276, ADR 0007): frozen violations of ArchitectureTest, committed with the code
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
# Read-only by default, locally and in CI: a stale store (violations fixed but still recorded), a rule
# missing from the store or a changed rule description fails the build instead of being re-frozen,
# and a failing run never rewrites the store. After removing violations, record the shrunk store with
#   ./mvnw test -Dtest=ArchitectureTest -Darchunit.freeze.store.default.allowStoreUpdate=true
# and commit it with the change.
freeze.store.default.allowStoreUpdate=false
